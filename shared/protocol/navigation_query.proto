// 职责：Unity、FlyWow Gateway和宿主Battle共享的唯一网络消息/命令编号合同。
// 边界：跨进程Proto；不把GridPos/Native指针/Skill内部状态带入长期协议。
// 输入/输出：CommandId+XxxRequest/Response -> Envelope里的Protobuf业务消息。
// 生命周期：同一源码自动生成Server descriptor/Registry及Unity C#；历史字段不可改号。
// 不负责：网络传输加密、账号授权、帧调度、战斗逻辑。
// 命名：XxxRequest和XxxResponse按枚举名字自动生成Registry；只含Response表示主动推送。
syntax = "proto3";
package battle.navigation.v1;

enum CommandId {
  COMMAND_UNSPECIFIED = 0;
  QUERY_CELL = 1001;
  RUN_AUTO_BATTLE = 1002;
  FRAME_JOIN = 1101;
  FRAME_INPUT = 1102;
  FRAME_PUSH = 1103;
  FRAME_RECOVER = 1104;
  FRAME_LEAVE = 1105;
  FRAME_REPLAY = 1106;
  STATE_JOIN = 1201;
  STATE_INPUT = 1202;
  STATE_CAST = 1203;
  STATE_PUSH = 1204;
  STATE_RECOVER = 1205;
  STATE_RESYNC = 1206;
  STATE_LEAVE = 1207;
  STATE_REPLAY = 1208;
}

message Envelope {
  uint32 protocol_version = 1; // 已有协议兼容版本，课程不修改其编号。
  uint32 command = 2;          // CommandId的值；发送方向决定消息类型。
  reserved 3; // 历史 request_id 编号不可复用；业务关联在 body 内定义。
  reserved "request_id";
  bytes body = 4;
}

message WorldPosition {
  sint64 x_mm = 1; // 世界X/Y/Z均整数毫米；负数合法。
  sint64 y_mm = 2;
  sint64 z_mm = 3;
}

message QueryCellRequest {
  uint32 map_id = 1;
  uint32 map_version = 2;
  WorldPosition position = 3;
}
message QueryCellResponse {
  enum ResultCode {
    RESULT_UNSPECIFIED = 0;
    OK = 1;
    MAP_NOT_FOUND = 2;
    MAP_VERSION_MISMATCH = 3;
    OUT_OF_BOUNDS = 4;
    NOT_WALKABLE = 5;
    BAD_REQUEST = 6;
    INTERNAL_ERROR = 7;
  }
  ResultCode result = 1;
  string message = 2;
  uint32 map_id = 3;
  uint32 map_version = 4;
  int32 grid_x = 5;
  int32 grid_z = 6;
  int32 cell_height_mm = 7;
  uint32 area = 8;
  uint32 clearance = 9;
}

message RunAutoBattleRequest { uint32 scenario_id = 1; }
message BattleEvent {
  uint32 seq = 1;
  uint32 logic_ms = 2;
  string type = 3;
  uint32 unit_id = 4;
  uint32 target_id = 5;
  uint32 attacker_id = 6;
  uint32 killer_id = 7;
  uint32 damage = 8;
  uint32 target_hp = 9;
  uint32 speed_mm_per_sec = 10; // 与现有Server/Unity Replay的毫米每秒合同对齐；版本4拒绝旧端。
  string reason = 11;
  string result = 12;
  WorldPosition position = 13;
  repeated WorldPosition points = 14;
}
message RunAutoBattleResponse {
  enum ResultCode {
    RESULT_UNSPECIFIED = 0;
    OK = 1;
    BAD_SCENARIO = 2;
    BUSY = 3;
    BATTLE_FAILED = 4;
    RESULT_TOO_LARGE = 5;
  }
  ResultCode result = 1;
  string message = 2;
  uint32 battle_id = 3;
  uint32 battle_version = 4;
  uint32 map_id = 5;
  uint32 map_version = 6;
  sint64 seed = 7;
  string battle_result = 8;
  uint32 end_logic_ms = 9;
  repeated BattleEvent events = 10;
}

// 第三课帧同步：正式帧统一携带玩家席位采用输入，不广播HP/权威位置。
message FrameCommand {
  uint32 frame = 1; // 请求生效帧，Service验证Deadline。
  sint32 x = 2;     // -1/0/1。
  sint32 z = 3;
  uint32 skill = 4; // 0无技能，1近战，2视觉弹丸，3逻辑弹丸。
}
message FramePlayerRecord {
  uint32 seat_id = 1;     // 服务端分配、正序稳定。
  FrameCommand input = 2;// 实际被采用的本席位输入。
  bool supplied = 3;     // false表示服务端缺输入填充。
}
message FrameRecord {
  uint32 frame = 1;                  // 严格连续的权威帧。
  repeated FramePlayerRecord players = 2; // 固定顺序；本课只有席位1。
  fixed32 hash = 3;                  // 状态FNV32分歧诊断，不是安全Hash。
}
message FrameJoinRequest {
  uint32 scenario_id = 1;
  uint32 battle_id = 2; // 0创建并立即开始单人Battle；非0连接已有Battle会被拒绝。
  uint32 simulation_version = 3; // 客户端正在运行的确定性模拟合同版本。
}
message FrameJoinResponse {
  string code = 1;          // OK/FULL/NOT_FOUND等。
  uint32 battle_id = 2;
  uint32 seat_id = 3;       // 绑定到当前Gateway Session的Seat。
  bytes resume_token = 4;  // 本席位独占32字节随机恢复凭据；不要进Replay/日志。
  uint32 generation = 5;   // 恢复时递增，旧代数失效。
  uint32 map_id = 6;
  uint32 map_version = 7;
  string map_hash = 8;      // 发布BMAP SHA-256；不包含rules源码Hash。
  uint32 frame = 9;
  bytes checkpoint = 10;   // 创建或恢复时的Checkpoint V3。
  uint32 tick_rate_hz = 11;
  uint32 future_window = 12;
  uint32 input_lead = 13;
  uint32 simulation_version = 14; // 服务端模拟版本；连接和回放元数据校验。
}
message FrameInputRequest {
  uint32 battle_id = 1;
  uint32 generation = 2;
  repeated FrameCommand inputs = 3; // 网络发送不自行声明Seat身份。
}
message FramePushResponse {
  uint32 battle_id = 1;
  uint32 generation = 2; // 目标席位会话代数。
  repeated FrameRecord records = 3;
  string code = 4; // OK/LATE/INPUT_WINDOW/CONFLICT/OVERLOAD/INTERNAL。
  uint32 winner = 5;
  bytes checkpoint = 6; // 保留：服务端请求客户端安装完整Checkpoint时使用。
}
message FrameRecoverRequest { uint32 battle_id = 1; bytes resume_token = 2; }
message FrameRecoverResponse { FrameJoinResponse state = 1; }
message FrameLeaveRequest { uint32 battle_id = 1; uint32 generation = 2; }
message FrameLeaveResponse { string code = 1; }
message FrameReplayRequest {
  uint32 battle_id = 1;
  bytes resume_token = 2;
  uint32 offset = 3;
}
message FrameReplayResponse {
  string code = 1;
  repeated FrameRecord records = 2; // 服务端按网络预算裁切分页。
  uint32 total = 3;
  FrameJoinResponse initial = 4;   // 首次提供初始状态；不包括Token。
}
message FrameReplay {
  uint32 format_version = 1; // V1文件封装；Checkpoint内容为V2。
  FrameJoinResponse initial = 2;
  repeated FrameRecord records = 3;
}

// 状态同步：Gateway只识别command，身份/幂等/确认由Battle处理。
message StateInput {
  uint32 input_seq = 1;
  sint32 x = 2;
  sint32 z = 3;
}
message StateCooldown {
  uint32 skill_id = 1;
  uint32 ready_tick = 2;
}
message StateUnit {
  uint32 instance_id = 1;
  uint32 unit_profile_id = 2;
  WorldPosition position = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 camp = 6;
  repeated StateCooldown cooldowns = 7;
}
message StateBolt {
  uint32 instance_id = 1;
  uint32 caster_id = 2;
  uint32 target_id = 3;
  WorldPosition position = 4;
  WorldPosition velocity_per_sec = 5;
  uint32 expires_tick = 6;
}
message StateEvent {
  uint32 event_seq = 1;
  uint32 server_tick = 2;
  string kind = 3;
  uint32 actor_id = 4;
  uint32 target_id = 5;
  uint32 skill_id = 6;
  uint32 cast_seq = 7;
  uint32 damage = 8;
  uint32 hp = 9;
  string code = 10;
  uint32 projectile_id = 11;
  WorldPosition position = 12;
}
message StateSnapshot {
  uint32 snapshot_seq = 1;
  uint32 base_seq = 2; // 0为全量；增量只应用于该明确基线。
  uint32 server_tick = 3;
  uint32 consumed_input_seq = 4; // 实际消费水位，不能用网络接收水位替代。
  uint32 event_watermark = 5;
  uint32 winner = 6; // 0进行中、1玩家胜、2敌方胜、3平局。
  repeated StateUnit units = 7;
  repeated uint32 removed_units = 8;
  repeated StateBolt bolts = 9;
  repeated uint32 removed_bolts = 10;
}
message StateJoinRequest {
  uint32 scenario_id = 1;
  uint32 simulation_version = 2;
}
message StateJoinResponse {
  string code = 1;
  uint32 battle_id = 2;
  uint32 generation = 3;
  bytes resume_token = 4;
  uint32 map_id = 5;
  uint32 map_version = 6;
  string map_hash = 7;
  string config_hash = 8;
  uint32 tick_rate_hz = 9;
  uint32 snapshot_rate_hz = 10;
  uint32 speed_mm_per_sec = 11;
  StateSnapshot snapshot = 12;
  uint32 simulation_version = 13;
  uint32 input_window = 14;
  uint32 navigation_profile_id = 15;
  uint32 next_cast_seq = 16; // 恢复后从Server实际接收水位继续离散命令。
}
message StateInputRequest {
  uint32 battle_id = 1;
  uint32 generation = 2;
  repeated StateInput inputs = 3;
  uint32 ack_snapshot_seq = 4;
  uint32 ack_event_seq = 5;
}
message StateInputResponse { string code = 1; uint32 consumed_input_seq = 2; }
message StateCastRequest {
  uint32 battle_id = 1;
  uint32 generation = 2;
  uint32 cast_seq = 3;
  uint32 skill_id = 4;
  uint32 target_id = 5;
}
message StateCastResponse {
  string code = 1;
  uint32 cast_seq = 2;
  uint32 apply_tick = 3;
}
message StatePushResponse {
  uint32 battle_id = 1;
  uint32 generation = 2;
  string code = 3;
  StateSnapshot snapshot = 4;
  repeated StateEvent events = 5;
}
message StateRecoverRequest { uint32 battle_id = 1; bytes resume_token = 2; }
message StateRecoverResponse { StateJoinResponse state = 1; }
message StateResyncRequest { uint32 battle_id = 1; uint32 generation = 2; }
message StateResyncResponse { StateSnapshot snapshot = 1; string code = 2; }
message StateLeaveRequest { uint32 battle_id = 1; uint32 generation = 2; }
message StateLeaveResponse { string code = 1; }
message StateReplayRequest {
  uint32 battle_id = 1;
  bytes resume_token = 2;
  uint32 offset = 3;
}
message StateReplayResponse {
  string code = 1;
  uint32 total = 2;
  StateJoinResponse initial = 3;
  repeated StatePushResponse records = 4;
}
message StateReplay {
  uint32 format_version = 1;
  StateJoinResponse initial = 2;
  repeated StatePushResponse records = 3;
}
