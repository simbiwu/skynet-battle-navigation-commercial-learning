// 职责：定义 Unity、Gateway 与 Battle 共用的消息和命令编号合同。
// 边界：跨 Unity Client Runtime、FlyWow Gateway 和 Server Battle Process 的共享协议源。
// 输入/输出：CommandId + XxxRequest + 可选 XxxResponse -> 统一 Envelope 中的业务消息。
// 生命周期：作为协议唯一源随 Git 发布；Server descriptor、Lua registry 和 Unity C# 必须由同一版本生成。
// 不负责：不定义 gRPC/RPC 服务、不规定业务是否必须回复、不决定地图通行、战斗结果或连接生命周期。
// 
// 解析规则：
// 1. 每个业务命令在 CommandId 中定义一次，枚举名使用全大写下划线，数值是稳定的 Envelope.command。
// 2. 枚举名按 QUERY_CELL -> QueryCell 转换为消息前缀；生成器按消息是否存在建立映射。
// 3. XxxRequest 与 XxxResponse 都存在时是请求-响应；只有 Request 时是单向请求；只有 Response 时是服务端主动下发。
// 4. 主动下发命令没有客户端 Request，Battle 通过 command_id 和目标连接发送 Response。
// 5. 本文件不使用 service/rpc、自定义 option 或注释 command_id；Python 只按上述固定规则生成 Server registry。
// 6. Unity 通过 protoc 生成消息和 CommandId；Server 由同一协议生成 Lua registry；两端不得手写另一份命令映射。
// 7. Envelope 只包含 protocol_version、command 和 body；请求响应关联由 Server 连接身份管理，不进入客户端协议。
syntax = "proto3";

package battle.navigation.v1;

enum CommandId {
  COMMAND_UNSPECIFIED = 0;
  QUERY_CELL = 1001;
  RUN_AUTO_BATTLE = 1002;
}

message Envelope {
  uint32 protocol_version = 1; // 线协议兼容边界版本。
  uint32 command = 2;          // CommandId 的数值；body 类型由消息方向和命令定义决定。
  bytes body = 3;              // command 对应消息的 Protobuf bytes。
}

message WorldPosition {
  sint64 x_mm = 1; // 世界 X，毫米；各端 WorldPosition 均使用有符号 64 位。
  sint64 y_mm = 2; // 世界高度 Y，毫米；单位和位宽与 X/Z 一致。
  sint64 z_mm = 3; // 世界 Z，毫米；负数合法。
}

message QueryCellRequest {
  uint32 map_id = 1;          // BMAP Header 中的业务地图 ID；必须大于 0。
  uint32 map_version = 2;     // 客户端期望查询的地图资产版本。
  WorldPosition position = 3; // 待查询的正式业务世界坐标。
}

message QueryCellResponse {
  enum ResultCode {
    RESULT_UNSPECIFIED = 0;
    OK = 1;
    MAP_NOT_FOUND = 2;
    MAP_VERSION_MISMATCH = 3;
    OUT_OF_BOUNDS = 4;
    NOT_WALKABLE = 5;
    BAD_REQUEST = 6;
    INTERNAL_ERROR = 7;
  }

  ResultCode result = 1;     // 稳定机器结果码；客户端不得按 message 分支。
  string message = 2;       // 面向日志和调试的诊断文字。
  uint32 map_id = 3;        // 实际接受查询的地图 ID。
  uint32 map_version = 4;   // 实际接受查询的地图资产版本。
  int32 grid_x = 5;         // 调试结果：地图内 X 列下标。
  int32 grid_z = 6;         // 调试结果：地图内 Z 行下标。
  int32 cell_height_mm = 7; // Cell 地表世界 Y，毫米。
  uint32 area = 8;          // 稳定 BattleArea 编码。
  uint32 clearance = 9;     // 到静态障碍/边界的距离，单位 Cell。
}

message RunAutoBattleRequest {
  uint32 scenario_id = 1; // 当前仅 1001；其他值返回 BAD_SCENARIO。
}

message BattleEvent {
  uint32 seq = 1;                     // 本场从 1 连续递增。
  uint32 logic_ms = 2;                // 固定 Tick 的逻辑时间，毫秒。
  string type = 3;                    // 稳定事件类型名。
  uint32 unit_id = 4;                 // 无主体事件为 0。
  uint32 target_id = 5;               // 无目标为 0。
  uint32 attacker_id = 6;             // 非攻击事件为 0。
  uint32 killer_id = 7;               // 非死亡事件为 0。
  uint32 damage = 8;                  // 权威伤害，非攻击事件为 0。
  uint32 target_hp = 9;               // 本次结算后的权威 HP。
  uint32 speed_mm_per_sec = 10;       // MOVE_PATH 的表现速度。
  string reason = 11;                 // 停止原因；无则空串。
  string result = 12;                 // BATTLE_END 结果；无则空串。
  WorldPosition position = 13;        // 有权威位置的事件才设置。
  repeated WorldPosition points = 14; // MOVE_PATH 世界路线点。
}

message RunAutoBattleResponse {
  enum ResultCode {
    RESULT_UNSPECIFIED = 0;
    OK = 1;
    BAD_SCENARIO = 2;
    BUSY = 3;
    BATTLE_FAILED = 4;
    RESULT_TOO_LARGE = 5;
  }

  ResultCode result = 1;              // 稳定机器结果码。
  string message = 2;                 // 限长诊断，不返回内部堆栈。
  uint32 battle_id = 3;              // OK 时有效。
  uint32 battle_version = 4;          // OK 时有效。
  uint32 map_id = 5;                 // OK 时有效。
  uint32 map_version = 6;            // OK 时有效。
  sint64 seed = 7;                   // OK 时有效。
  string battle_result = 8;           // FINISHED 或 TIMEOUT。
  uint32 end_logic_ms = 9;            // 结束逻辑时间，毫秒。
  repeated BattleEvent events = 10;   // 按 seq 排列的权威事件。
}
